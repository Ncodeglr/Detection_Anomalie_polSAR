# Configuration globale pour le pipeline de Détection d'Anomalies PolSAR
# Approche Deep Learning (Auto-encodeur Complexe)

seed: 42
task: "reconstruction"

# --- 1. Architecture du Modèle ---
model:
  name: "ComplexAutoencoder"
  layer_mode: "complex"
  in_channels: 4
  num_layers: 3
  channels_width: [16, 32, 64]   # Format liste recommandé pour s'adapter aux num_layers dans cvnn
  activation: "crelu"            # CReLU (Complex ReLU) natif de cvnn
  upsampling_layer: "bilinear"
  normalization_layer: "batch_norm"
  residual: true
  num_blocks: 1
  latent_dim: 512
  
  # Paramètres requis pour basculer sur un VAE (setup_loss_optimizer)
  decoder_variance:
    learned_variance: false
    min_log_sigma: -20.0

# --- 2. Configuration des Données ---
data:
  dataset:
    name: "PolSFDataset"         # Ou "ALOS" selon l'intégration dans cvnn
    trainpath: "./data/SAN_FRANCISCO_ALOS2"
    base_dir: "/home/nicolas/Documents/polSAR_Control/data"
    azimut_split_x1: 1750
    azimut_split_x2: 3000
    has_labels: False
    
    patch_size: 32
    patch_stride: 32

  batch_size: 32
  num_workers: 0
  shuffle: True

  # Division des données
  valid_ratio: 0.1
  test_ratio: 0.1 

  recompute_statistics: True
  
  # Pipeline de Prétraitement Modulaire
  preprocessing:
    method: "complex_standardization"
    scale_factor: 10.0           # Évite que les réflecteurs brillants n'écrasent la loss MSE

  transforms:
    - name: "logamplitude"

# --- Paramètres d'entraînement Deep Learning ---
training:
  epochs: 5
  best_model_name: "best_autoencoder.pth"

loss:
  name: "MSE"                    # Transformé automatiquement en ComplexMSELoss par cvnn
  use_class_weights: false

# --- Optimisation et Scheduler ---
optim:
  algo: "AdamW"
  params:
    lr: 0.0005
    weight_decay: 0.0001

scheduler:
  name: "ReduceLROnPlateau"
  params:
    mode: "min"
    factor: 0.5
    patience: 5
    min_lr: 0.00001

# --- Suivi des Expériences ---
wandb:
  project: "polSAR-anomaly-detection-DL"
