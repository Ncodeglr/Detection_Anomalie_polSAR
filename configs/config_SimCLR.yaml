# Configuration pour l'entraînement auto-supervisé (SimCLR)

seed: 42

# --- 1. Architecture de l'Encodeur ---
model:
 class: AutoEncoder 
 num_layers: 3
 channels_width: 32
 activation: "CReLU"
 num_blocks: 1
 layer_mode: "complex"
 normalization_layer: "batch"
 downsampling_layer: "maxpool"
 residual: True
 dropout: 0.0
 latent_dim: 256


# --- 2. Configuration des Données ---
data:
 dataset:
   name: ALOSDataset
   trainpath: "./data/SAN_FRANCISCO_ALOS2"
   base_dir: "/home/nicolas/Documents/polSAR_Control/data"
   patch_size: 64
   patch_stride: 32 # Génère ~4x plus de données par chevauchement
 batch_size: 512 # Valeur plus sûre pour la VRAM (repassez à 512 si votre GPU le supporte)
 num_workers: 4
 valid_ratio: 0.1
 test_ratio: 0.1
 shuffle: True
 recompute_statistics: True

# --- 3. Nombre d'epochs ---
epochs: 200 # SimCLR converge plus lentement, 200 est un bon minimum

# --- 4. Optimisation et Scheduler (adaptés pour SimCLR) ---
optim:
 algo: AdamW
 params:
    lr: 0.0005 # Reduced from 0.0005 for more stable training
    weight_decay: 0.001 # Increased weight decay for better regularization
    betas: [0.9, 0.999]

scheduler:
  name: ReduceLROnPlateau
  params:
    mode: min
    factor: 0.5
    patience: 5
    min_lr: 0.000001

# --- 7. Suivi des Expériences avec Wandb ---
logging:
 wandb:
   project: "polSAR-anomaly-detection-SimCLR"